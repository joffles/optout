# ---------------------------------------------------------------- mail

- id: dmachoice
  name: DMAchoice (ANA mail preference service)
  category: mail
  method: web
  url: https://www.dmachoice.org/
  mail_address: |
    DMAchoice Consumer Preferences
    P.O. Box 900
    Cos Cob, CT 06807
  per: address
  fields: [name, address, email]
  renew_days: 3650
  cost: "$8 online / $9 by mail (10 years)"
  automation: assisted
  notes: |
    Stops prospecting mail from ANA member companies for 10 years. Does not
    stop mail from companies you already do business with, or Every Door
    Direct Mail (zip-code saturation). Register each person at each address.
    Allow 90 days to take effect. Mail-in: check or money order payable to ANA.

- id: dmachoice-emps
  name: DMAchoice Email Preference Service (eMPS)
  category: email
  method: web
  url: https://www.dmachoice.org/
  per: email
  fields: [email]
  renew_days: 2190
  cost: Free
  automation: assisted
  notes: |
    Separate from the mail registration. Suppresses prospecting email from
    ANA members for 6 years. One submission per email address.

- id: optoutprescreen
  name: OptOutPrescreen (credit bureau pre-approved offers)
  category: credit-offers
  method: web
  url: https://www.optoutprescreen.com/
  phone: "1-888-567-8688"
  mail_address: |
    Opt-Out Department
    P.O. Box 530200
    Atlanta, GA 30353
  per: person
  fields: [name, address, date_of_birth]
  renew_days: 1825
  cost: Free
  automation: assisted
  notes: |
    Joint Equifax/Experian/TransUnion/Innovis site. Online = 5 years;
    the printed, signed form mailed in = permanent. SSN is optional on the
    form; this tool never stores or types your SSN. Phone: 1-888-5-OPT-OUT.
    Do this for every adult in the household; it is per person.

- id: catalogchoice
  name: Catalog Choice
  category: mail
  method: web
  url: https://www.catalogchoice.org/
  per: address
  fields: [name, address, email]
  renew_days: 180
  cost: Free
  automation: assisted
  notes: |
    Free account; opt out of individual catalogs by name, using the customer
    number printed on the catalog's back cover when you have it. Re-check
    every few months as new catalogs arrive.

- id: valpak
  name: Valpak blue envelope
  category: mail

# Opt-out registry catalog. Edit freely; `optout list` reads this file.
#
# Fields
#   id            stable slug used on the command line
#   name          display name
#   category      phone | mail | email | credit-offers | data-broker
#   method        web | email | phone | mail
#   url           page to open (web) or info page
#   phone         number to call (phone method, or alternative)
#   email_to      address to write to (email method)
#   mail_address  postal address (mail method)
#   per           what one submission covers: person | phone | email | address
#   max_per_submission  how many units one form submission accepts (phones)
#   fields        identity fields the form asks for (for autofill + copy block)
#   renew_days    re-run/re-check interval; null = permanent
#   cost          free text
#   states        restrict to residents of these states (null = everyone)
#   verify_url    where to confirm registration later
#   automation    assisted  = tool opens + autofills, you review & submit
#                 prohibited = site terms forbid bots; tool opens page only
#   notes         gotchas, shown by `optout show <id>`

- id: national-dnc
  name: National Do Not Call Registry (FTC)
  category: phone
  method: web
  url: https://www.donotcall.gov/register.html
  phone: "1-888-382-1222"
  per: phone
  max_per_submission: 3
  fields: [phones, email]
  renew_days: null
  cost: Free
  verify_url: https://www.donotcall.gov/verify.html
  automation: assisted
  notes: |
    Up to 3 numbers per submission. You must click the confirmation link
    emailed to you within 72 hours or the registration is dropped.
    Alternative: call 1-888-382-1222 FROM the phone you want registered.
    Registration never expires. It only stops legitimate telemarketers;
    scammers ignore it, so pair it with carrier call blocking.

- id: tx-no-call
  name: Texas No Call List
  category: phone
  method: web
  url: https://www.texasnocall.com/
  phone: "1-866-896-6225"
  per: phone
  fields: [phones, address]
  renew_days: 1095
  cost: Small fee (check site)
  states: [TX]
  automation: assisted
  notes: |
    Texas residents only. Registration lasts 3 years. Verify the URL and
    fee on the site; state sites change hosting periodically.

- id: pa-do-not-call

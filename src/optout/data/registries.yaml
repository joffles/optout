  url: https://www.valpak.com/coupons/show/mailinglistsuppression
  per: address
  fields: [name, address]
  renew_days: null
  cost: Free
  automation: assisted
  notes: Address suppression form; allow 6-8 weeks.

- id: save-vericast
  name: Save / Vericast (RedPlum, RetailMeNot Everyday)

# ---------------------------------------------------------- data brokers

- id: ca-drop
  name: California DROP (Delete Request and Opt-out Platform)
  category: data-broker
  method: web
  url: https://privacy.ca.gov/drop/
  per: person
  fields: [name, address, email, phones, date_of_birth]
  renew_days: 365
  cost: Free
  states: [CA]
  verify_url: https://privacy.ca.gov/drop/
  automation: prohibited
  notes: |
    California residents only. One request goes to every data broker
    registered with the state (500+). Identity is verified through the
    California Identity Gateway or Login.gov, so the tool only opens the
    page; do the verification yourself. Brokers must process requests
    every 45 days from Aug 2026. Re-submit yearly to catch new brokers.

- id: acxiom
  name: Acxiom marketing opt-out
  category: data-broker
  method: web
  url: https://isapps.acxiom.com/optout/optout.aspx
  per: person
  fields: [name, address, email, phones]
  renew_days: null
  cost: Free
  automation: assisted
  notes: |
    Pick the consumer opt-out, choose "Me", submit, then click the link in
    the "Consumer Opt-Out Verification" email and complete the second
    CAPTCHA. Takes about two weeks. Separate deletion request is available
    through Acxiom's privacy portal if you want data purged, not just
    suppressed.

